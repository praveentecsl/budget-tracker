

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000

    depends_on:
      - backend
    networks:
      - mynetwork

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/mydb
    depends_on:
      - mongo
    networks:
      - mynetwork

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mynetwork

networks:
  mynetwork:

volumes:
  mongo-data:
